<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f4fc4">
  <title>시간표 리그</title>
  <meta name="description" content="말로 시간표를 짜고, 대표 시간표 점수로 학과끼리 겨루는 인천대 학과 대항전">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231f4fc4'/%3E%3Cpath d='M8 3c2 2 3 3.4 3 5.2A3 3 0 0 1 5 8.2C5 6.6 6.2 5.3 8 3z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <div class="app">
    <!-- 데스크톱: 왼쪽 아이콘 메뉴 · 휴대폰: 하단 탭 -->
    <nav class="rail" aria-label="주 메뉴">
      <a class="rail-logo" href="#/" aria-label="처음으로"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 3 5 5.2 5 8a5 5 0 0 1-10 0c0-2.4 1.8-4.6 5-8z"/></svg></a>
      <a href="#/profile" data-route="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>편성</span></a>
      <a href="#/" data-route=""><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10v3a5 5 0 0 1-10 0zM5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3M12 12v4M8 20h8M9 16h6v4H9z"/></svg><span>대항전</span></a>
      <a href="#/me" data-route="me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span>내 현황</span></a>
      <a href="#/league" data-route="league"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20V9M20 20V14"/></svg><span>순위표</span></a>
      <a class="rail-avatar" href="#/me" id="rail-avatar" aria-label="내 현황"></a>
    </nav>
    <aside class="side" aria-label="시간표 편성 절차">
      <a class="side-brand" href="#/">시간표 리그</a>
      <p class="side-title">시간표 편성 절차</p>
      <ol class="steps" id="steps"></ol>
      <div class="greet" id="greet"></div>
    </aside>
    <div class="main-col">
      <header class="top">
        <a class="top-brand" href="#/">시간표 리그</a>
        <nav class="crumbs" id="crumbs" aria-label="현재 위치"></nav>
        <span class="top-user" id="top-user"></span>
      </header>
      <ol class="steps steps-inline" id="steps-inline" aria-label="시간표 편성 절차"></ol>
      <main id="view" tabindex="-1"></main>
      <footer class="foot">
        <p>바이브코딩 대회 출품작이며 학교의 공식 시스템이 아닙니다. 강의 자료 기준일: 2026. 8. 4. · <a href="#/join">참여 QR 보기</a></p>
      </footer>
    </div>
  </div>
  <div id="dialog"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
